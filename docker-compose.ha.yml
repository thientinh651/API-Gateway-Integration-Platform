# HA demo bảo vệ: Nginx LB + 2 instance gateway (Active-Active)
#
#   docker compose -f docker-compose.ha.yml up --build -d
#   ./scripts/docker-ha-demo.sh
#
# LB: http://127.0.0.1:8080  (tránh trùng systemd :3000 trên host)
# DB: volume chung gateway-data (SQLite — đủ cho demo đồ án)

services:
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/docker-ha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      middleware-instance-1:
        condition: service_started
      middleware-instance-2:
        condition: service_started
    restart: unless-stopped

  middleware-instance-1:
    build: .
    container_name: middleware-instance-1
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "sqlite:data/gateway.db?mode=rwc"
      INSTANCE_NAME: "middleware-instance-1"
      COOKIE_SECURE: "false"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

  middleware-instance-2:
    build: .
    container_name: middleware-instance-2
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "sqlite:data/gateway.db?mode=rwc"
      INSTANCE_NAME: "middleware-instance-2"
      COOKIE_SECURE: "false"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

volumes:
  gateway-data:
