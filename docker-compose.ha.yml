# HA demo: Nginx LB + 2 gateway → PostgreSQL + Redis (shared, tuned 2GB)
# Cảnh báo: 2 instance gateway nặng hơn single — ưu tiên demo HA ngắn, không chạy lâu trên 2GB.
#
#   docker compose -f docker-compose.ha.yml up --build -d
#   ./scripts/docker-ha-demo.sh
#
# LB: http://127.0.0.1:8080

services:
  postgres:
    image: postgres:16-alpine
    container_name: avaso-postgres
    environment:
      POSTGRES_USER: avaso
      POSTGRES_PASSWORD: avaso
      POSTGRES_DB: avaso_gateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avaso -d avaso_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: avaso-redis
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  nginx-lb:
    image: nginx:1.27-alpine
    container_name: nginx-lb
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/docker-ha.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      middleware-instance-1:
        condition: service_started
      middleware-instance-2:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  middleware-instance-1:
    build: .
    container_name: middleware-instance-1
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgres://avaso:avaso@postgres:5432/avaso_gateway"
      REDIS_URL: "redis://redis:6379"
      PG_POOL_MAX: "4"
      INSTANCE_NAME: "middleware-instance-1"
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  middleware-instance-2:
    build: .
    container_name: middleware-instance-2
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      BIND_HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgres://avaso:avaso@postgres:5432/avaso_gateway"
      REDIS_URL: "redis://redis:6379"
      PG_POOL_MAX: "4"
      INSTANCE_NAME: "middleware-instance-2"
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
