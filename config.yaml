routes:
  - path: "/v1/api/fact"
    target: "https://catfact.ninja/fact"
  - path: "/v1/api/demo"
    target: "https://httpbin.org"

# OAuth2 clients — seed lần đầu; runtime dùng PostgreSQL gateway_client_keys.
api_keys:
  - "demo-key-1"

rate_limit:
  enabled: true
  rps: 10
  burst: 20

# Bật/tắt global trong Cài đặt hệ thống; per-route override trên form Route.
transform:
  enabled: false
retry:
  enabled: false
queue:
  enabled: false
