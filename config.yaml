routes:
  - path: "/test"
    target: "https://httpbin.org"
  - path: "/my-api"
    target: "http://localhost:5000"

# OAuth2 clients — seed lần đầu; runtime dùng PostgreSQL gateway_client_keys.
# Data-plane bắt buộc Bearer JWT từ POST /oauth/token.
api_keys:
  - "demo-key-1"

rate_limit:
  enabled: true
  rps: 10
  burst: 20

# Bật/tắt global trong Cài đặt hệ thống; per-route override trên form Route.
transform:
  enabled: false
retry:
  enabled: false
queue:
  enabled: false
