routes:
  - path: "/test"
    target: "https://httpbin.org"
  - path: "/my-api"
    target: "http://localhost:5000"

# Legacy YAML keys — seed lần đầu; runtime dùng SQLite gateway_client_keys (HMAC).
# Khi DB đã có client keys, data-plane bắt buộc HMAC (không còn "open proxy").
api_keys:
  - "demo-key-1"

rate_limit:
  enabled: true
  rps: 10
  burst: 20

# Bật/tắt global trong Cài đặt hệ thống; per-route override trên form Route.
transform:
  enabled: false
retry:
  enabled: false
queue:
  enabled: false
