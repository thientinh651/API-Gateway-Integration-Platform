routes:
  - path: "/v1/api/fact"
    target: "https://catfact.ninja/fact"
  - path: "/v1/api/demo"
    target: "https://httpbin.org"

# OAuth2 clients — seed lần đầu; runtime dùng PostgreSQL gateway_client_keys.
api_keys:
  - "demo-key-1"

rate_limit:
  enabled: true
  # Fallback khi client/route không set RPM. 600/phút = 10 req/s (trước đây field `rps`).
  per_min: 600
  # Trần burst hệ thống (cap). Client/route/global: min(RPM, burst) khi burst_enabled.
  burst: 20
  # burst_enabled mặc định true nếu thiếu key (xem RateLimitConfig).

# Bật/tắt global trong Cài đặt hệ thống; per-route override trên form Route.
transform:
  enabled: false
retry:
  enabled: false
queue:
  enabled: false
