# Avaso Gateway — Redis session (VPS 2GB)
# Include: include /path/to/avaso.conf  OR copy vào /etc/redis/redis.conf.d/

bind 127.0.0.1 ::1
protected-mode yes
port 6379

# Session only — giới hạn RAM, eviction LRU khi đầy
maxmemory 128mb
maxmemory-policy allkeys-lru

# Không cần persistence session (mất Redis = login lại)
save ""
appendonly no

timeout 0
tcp-keepalive 300
