# PostgreSQL tuning — Droplet ~2GB RAM (đồ án / demo)
# Ubuntu: copy → /etc/postgresql/16/main/conf.d/avaso-2gb.conf
# Docker: dùng command trong docker-compose (tương đương)

shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
max_connections = 40
wal_buffers = 4MB
random_page_cost = 1.1
