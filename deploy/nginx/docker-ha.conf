# Docker Compose HA — Nginx load balancer → 2 gateway instances
# Mount vào container nginx-lb: /etc/nginx/conf.d/default.conf

upstream gateway_round_robin {
    server middleware-instance-1:3000 max_fails=2 fail_timeout=5s;
    server middleware-instance-2:3000 max_fails=2 fail_timeout=5s;
}

# Admin + cookie session: sticky theo IP client (tránh nhảy instance giữa request)
upstream gateway_admin_sticky {
    ip_hash;
    server middleware-instance-1:3000 max_fails=2 fail_timeout=5s;
    server middleware-instance-2:3000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location ^~ /api/ {
        proxy_pass http://gateway_admin_sticky;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /v1/ {
        proxy_pass http://gateway_round_robin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://gateway_round_robin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
