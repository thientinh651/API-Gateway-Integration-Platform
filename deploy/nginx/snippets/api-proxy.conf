# Snippet: proxy /api/* → avaso-gateway (Unix socket hoặc TCP).
# Cách dùng: trong `server { ... }` HTTPS của site, thêm MỘT dòng (đường dẫn tùy máy):
#   include /path/to/avaso-gateway/deploy/nginx/snippets/api-proxy.conf;
#
# QUAN TRỌNG: block `location ^~ /api/` phải nằm TRƯỚC `location /` dùng `try_files` SPA,
# nếu không curl https://domain/api/ping sẽ 404 body rỗng.

upstream avaso_gateway_backend {
    server 127.0.0.1:3000;
    keepalive 8;
}

location ^~ /api/ {
    proxy_pass http://avaso_gateway_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
