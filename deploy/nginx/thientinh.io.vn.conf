##
## Nginx vhost for thientinh.io.vn
## - http -> https redirect
## - www -> apex redirect
## - reverse proxy to upstream app
##

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80: always redirect to https
server {
    listen 80;
    listen [::]:80;

    server_name thientinh.io.vn www.thientinh.io.vn;

    return 301 https://thientinh.io.vn$request_uri;
}

# 443: redirect www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.thientinh.io.vn;

    ssl_certificate     /etc/letsencrypt/live/thientinh.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thientinh.io.vn/privkey.pem;

    return 301 https://thientinh.io.vn$request_uri;
}

# 443: main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name thientinh.io.vn;

    ssl_certificate     /etc/letsencrypt/live/thientinh.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thientinh.io.vn/privkey.pem;

    # TLS hardening (safe defaults)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    # Optional: serve static web dashboard directly
    # root /var/www/avaso-gateway/web;
    # index index.html;
    # location = / { try_files /index.html =404; }

    # Reverse proxy (edit upstream port/path)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

